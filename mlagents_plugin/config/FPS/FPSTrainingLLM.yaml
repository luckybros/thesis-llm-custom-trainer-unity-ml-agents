behaviors:
  FPS:
    trainer_type: llm_trainer
    hyperparameters:
      batch_size: 512 # per solo azioni discreti consigliano 512, buono anche per il discorso bug, altrimenti non si aggiorna
      buffer_size: 5120
      learning_rate: 0.0003
      alpha_initial: 0.05
      alpha_final: 0.4
      alpha_rate_schedule: linear
      beta: 0.02
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant # per il self play è buono costante piuttosto che lineare
      communicator: zmq
      zmq_base_port: 65001
      llm_refresh_interval: 10
      observation_types:
        - name: RAYCAST_FRONT
          type: RAYCAST
          index: 0
        - name: VECTORIAL
          type: VECTORIAL
          index: 1
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      rnd:
        gamma: 0.99
        strength: 0.05
        encoding_size: 64
        learning_rate: 0.0001
    keep_checkpoints: 1
    max_steps: 500000 
    time_horizon: 256 #1000 #64
    summary_freq: 1000 # default a 10000
    threaded: false # a self play consigliano di levarlo 
    checkpoint_interval: 50000
engine_settings:
  # Player movement runs in Update (one move per frame), decisions every 0.1s of game time (DecisionPeriod 5 x 0.02s).
  # Frame length = time_scale / capture_frame_rate = 20/200 = 0.1s -> exactly one decision per frame
  # (12 deg turn / 1.3 m per decision). With the default 60 a frame lasts 0.33s and 2 decisions out of 3 are overwritten.
  time_scale: 20
  capture_frame_rate: 200
