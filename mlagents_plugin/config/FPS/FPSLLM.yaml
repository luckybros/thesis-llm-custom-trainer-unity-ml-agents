llm_settings:
  game_desc: |
    The FPS Microgame is a 3D first-person shooter set in an indoor facility made of small rooms connected by
    narrow corridors, so walls are almost always close to you. Two kinds of hostile robots guard the rooms.
    Hover bots fly toward you as soon as they see you and fight at short range. Turrets are fixed in place but
    have a very long range and can hit you before you see them. Both turn to face you and shoot straight at you.
    Health pickups on the floor restore your life. You progress by destroying the enemies and lose if your life
    reaches zero.
  agent_role: |
    You are the AI controlling the player. At each step you receive your status, what you see in front of you and
    your recent history: reason about the situation and choose one option for each action category.

    [ACTIONS]
    - Move forward: walk forward or backward along your facing direction (backward goes where you cannot see).
    - Move sideways: strafe right or left without changing where you face.
    - Turn: rotate your facing direction right or left by a small fixed angle, without moving.
    - Shoot: fire straight ahead; the shot hits only an enemy directly ahead.
    The four categories are executed together in the same step.

    [OBSERVATIONS]
    - Life: CRITICAL, LOW, MEDIUM, HEALTHY.
    - Under fire: YES means you were hit a moment ago. If you see no enemy, it is behind you or out of sight:
      turn around or leave its line of fire.
    - View: a half circle in front of you, split into directions from far left to far right. Each direction
      reports the first wall, hover bot, turret or health pickup it meets and how near it is (immediate, close,
      medium, far). A direction that is not mentioned is open. You see nothing behind you.
    - In these corridors every direction ends on a wall sooner or later: a wall tells you how much room you have,
      not that the way is closed. Only a wall at immediate range directly ahead stops you from moving forward;
      walls on your sides are simply the corridor.
    - A turn is small: something on the far left or far right needs several turns to be directly ahead.

    [TACTICAL GUIDELINES]
    - Navigation: when the path ahead is open, go straight: move forward without turning. Turn only to face a wider
      opening, an enemy or a health pickup, and stop turning once it is directly ahead. If the wall directly ahead
      is immediate, turn or strafe toward the more open side, and keep turning the same way until the path opens.
      Standing completely still is rarely useful.
    - Distances are coarse: while you walk along a long corridor the view can stay the same for several steps,
      and that is normal progress. A repeated view is a problem only if walls at immediate or close range stay
      the same while you keep trying to move: then try something different.
    - Combat: turn until the enemy is directly ahead before shooting, and keep strafing while you fire: enemies
      aim at you, so a moving target is harder to hit. Keep some distance from hover bots instead of rushing them.
      Turrets cannot move: use the corridor walls to get out of their line of fire, or approach them while strafing.
    - Survival: when your life is low, look for health pickups and avoid close fights.

    [OUTPUT FORMAT]
    Plain text, no markdown. Start directly with "Reasoning:", keep it brief, then write the Agent block and
    nothing after it. Use exactly the option strings listed in the ACTION SET.
    Reasoning:
    - Current Situation: what you see and what the history tells you.
    - Tactical Goal: what you need to achieve now.
    - Action Selection: why your four choices achieve it.
    - Consistency Check: confirm the choices do not contradict the situation.
    Agent 0:
      Move forward
        <option>
      Move sideways
        <option>
      Turn
        <option>
      Shoot
        <option>

    [EXAMPLE]
    Reasoning:
    - Current Situation: Hover bot slightly right at medium range, corridor walls on the far sides at close range, path ahead open.
    - Tactical Goal: Bring the hover bot directly ahead without standing still in its line of fire.
    - Action Selection: Turn right to align, strafe left to make its shots miss, keep the distance; no shot until it is directly ahead.
    - Consistency Check: The enemy is not directly ahead yet, so shooting would miss; nothing blocks my movement.
    Agent 0:
      Move forward
        Stay
      Move sideways
        Move left
      Turn
        Turn right
      Shoot
        Don't shoot

  history_length: 3
  model_name: mistral-small:24b
  task: Explore the map, find and destroy the enemies, and stay alive.
  actions:
    discrete:
      - name: Move forward
        options: [Stay, Move forward, Move backward]
        description: >
          Walk forward or backward along your facing direction.
      - name: Move sideways
        options: [Stay, Move right, Move left]
        description: >
          Strafe right or left without changing your facing direction.
      - name: Turn
        options: [Stay, Turn right, Turn left]
        description: >
          Rotate your facing direction without moving.
      - name: Shoot
        options: [Don't shoot, Shoot]
        description: >
          Fire straight ahead; it hits only an enemy directly ahead.
  default_agent_action: |
      Agent 0:
        Move forward
          Move forward
        Move sideways
          Stay
        Turn
          Stay
        Shoot
          Don't shoot
  use_visual_obs: False
  use_vectorial_obs: True
  use_grid_obs: False
  use_raycast_obs: True
  num_agents: 1
  # Vector observation (PlayerAgent.CollectObservations): [0] health ratio, [1] under fire (0/1). Same set for RL and LLM.
  obs_template: |
    [Life]: {health} | [Under fire]: {under_fire} | [View]: {RAYCAST_FRONT}
  features:
    vectorial:
      health:
        type: "BUCKET"
        indices: [0]
        mapping:
          - label: "CRITICAL"
            min: 0.0
            max: 0.25
          - label: "LOW"
            min: 0.251
            max: 0.50
          - label: "MEDIUM"
            min: 0.51
            max: 0.80
          - label: "HEALTHY"
            min: 0.81
            max: 1.1
      # BUCKET instead of BOOL: _process_boolean does int() on a 1-element array, which fails with recent numpy
      under_fire:
        type: "BUCKET"
        indices: [1]
        mapping:
          - label: "NO"
            min: 0.0
            max: 0.5
          - label: "YES"
            min: 0.51
            max: 1.1
    raycast:
      RAYCAST_FRONT:
        # Same order as DetectableTags on the RayPerceptionSensor: Wall, HoverBot, Health, Turret
        detectable_tags:
          0: "WALL"
          1: "HOVER BOT"
          2: "HEALTH PICKUP"
          3: "TURRET"
        num_detectable_tags: 4
        num_rays: 9   # RaysPerDirection 4, MaxRayDegrees 70: one ray per direction
        direction: [
          FAR_LEFT, LEFT, "FRONT LEFT", SLIGHT_LEFT,
          FORWARD,
          SLIGHT_RIGHT, "FRONT RIGHT", RIGHT, FAR_RIGHT
        ]
        # RayLength 20, SphereCastRadius 0.3, sensor centred on the player.
        # Wall surface ≈ frac*20 + 0.3 m; the player covers ~1.3 m per decision.
        distance:
          - label: IMMEDIATE   # < ~1.5 m: collision at the next step
            min: 0.0
            max: 0.06
          - label: CLOSE       # ~1.5-3 m
            min: 0.06
            max: 0.14
          - label: MEDIUM      # ~3-7 m
            min: 0.14
            max: 0.34
          - label: FAR         # > ~7 m
            min: 0.34
            max: 1.1
