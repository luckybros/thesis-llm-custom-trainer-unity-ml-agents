behaviors:
  Tanks:
    trainer_type: llm_trainer
    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 0.0003
      alpha_initial: 0.05
      alpha_final: 0.4
      alpha_rate_schedule: linear
      beta: 0.02
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      communicator: zmq
      llm_refresh_interval: 100
      observation_types:
        - name: VISUAL
          type: VISUAL
          index: 0
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      rnd:
        gamma: 0.99
        strength: 0.05
        encoding_size: 64
        learning_rate: 0.0001
    keep_checkpoints: 1
    max_steps: 500000
    time_horizon: 256 #1000 #64
    summary_freq: 1000
    threaded: false
    checkpoint_interval: 50000
    self_play:
      save_steps: 50000 # 50000
      team_change: 200000 # 200000
      swap_steps: 2000 # 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0